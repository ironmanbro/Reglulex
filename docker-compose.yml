# Self-hosted stack on one machine: Postgres + web + worker.
# Original files are kept on the `originals` volume (STORAGE_DRIVER=local).
#   cp .env.example .env   # set ADMIN_PASSWORD_HASH and SESSION_SECRET
#   docker compose up -d --build
# To use S3/R2 instead, set STORAGE_DRIVER=s3 and the S3_* variables below.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fi_library
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi -d fi_library"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    image: fi-library:local
    command: ["web"]
    env_file: .env
    environment: &appenv
      DATABASE_URL: postgres://fi:${POSTGRES_PASSWORD:-change-me}@db:5432/fi_library
      DATABASE_SSL: disable
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/data/storage
    volumes: [originals:/app/data/storage]
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
    restart: unless-stopped

  worker:
    image: fi-library:local
    command: ["worker"]
    env_file: .env
    environment: *appenv
    volumes: [originals:/app/data/storage]
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  originals:
