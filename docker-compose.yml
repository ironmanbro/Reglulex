# Self-hosted stack: Postgres + S3-compatible storage (MinIO) + web + worker.
#   cp .env.example .env   # set ADMIN_PASSWORD_HASH and SESSION_SECRET
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fi_library
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi -d fi_library"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fi-library}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-please}
    volumes: [objects:/data]
    restart: unless-stopped

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS}; do sleep 2; done;
             mc mb --ignore-existing local/fi-library-originals"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-fi-library}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY:-change-me-please}

  web:
    build: .
    command: ["web"]
    env_file: .env
    environment: &appenv
      DATABASE_URL: postgres://fi:${POSTGRES_PASSWORD:-change-me}@db:5432/fi_library
      STORAGE_DRIVER: s3
      S3_BUCKET: fi-library-originals
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fi-library}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-please}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      create-bucket: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    env_file: .env
    environment: *appenv
    depends_on:
      db: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  objects:
